name: Deploy C9MYR hub to Cloudflare

# The C9MYR hub (default brand, C9MYR's Supabase project) served from the
# Cloudflare Worker "c9" (c9.<account>.workers.dev), alongside GitHub Pages.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the C6
# deploy. Set the repository variable C9_WORKER_NAME to use another name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c9-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engagement-hub
        run: pnpm --filter @workspace/engagement-hub run build
        env:
          PORT: "4173"
          # Served from the root of its own domain, unlike GitHub Pages.
          BASE_PATH: /

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy --name "${{ vars.C9_WORKER_NAME || 'c9' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
