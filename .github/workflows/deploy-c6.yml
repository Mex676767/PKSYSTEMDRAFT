name: Deploy C6 hub to Cloudflare

# C6 static frontend stays on its existing workers.dev origin during
# migration. /api requests are reverse-proxied to the C6 DigitalOcean API.
#
#   Variables: C6_BRAND_NAME, C6_DO_API_ORIGIN, C6_WORKER_NAME (default c6)
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c6-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.C6_DO_API_ORIGIN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engagement-hub for C6
        run: pnpm --filter @workspace/engagement-hub run build
        env:
          PORT: "4173"
          # Served from the root of its own domain.
          BASE_PATH: /
          VITE_BRAND_NAME: ${{ vars.C6_BRAND_NAME || 'C6' }}
          VITE_API_URL: ""

      - name: Deploy to Cloudflare
        # Plain npx rather than cloudflare/wrangler-action, which tries to
        # `pnpm add` wrangler into the workspace root and fails.
        run: npx --yes wrangler@4 deploy --name "${{ vars.C6_WORKER_NAME || 'c6' }}" --var "DO_API_ORIGIN:${{ vars.C6_DO_API_ORIGIN }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
