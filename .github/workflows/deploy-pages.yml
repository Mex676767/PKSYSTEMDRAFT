name: Deploy to GitHub Pages

# The C9MYR hub moved to https://c9.mextest67.workers.dev (deploy-c9-worker.yml).
# The old GitHub Pages address now only serves a redirect to the same page
# there, plus a push worker that switches off the old address's push
# notifications. See deploy/github-pages-redirect/.

on:
  push:
    branches: [main]
    paths:
      - deploy/github-pages-redirect/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
