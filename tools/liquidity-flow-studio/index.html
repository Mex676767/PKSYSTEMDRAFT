<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquidity Flow Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>if (window.tailwind) tailwind.config = { corePlugins: { preflight: false }, theme: { extend: { colors: { carbon: '#080A0E', slate: { card: '#111622', line: '#1E293B' } } } } };</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: header bar / [viewport + timeline | inspector dock]. Bloomberg-style HUD on carbon slate. */
:root{
  --bg:#080A0E; --panel:#0B0E15; --card:#111622; --card-2:#161C2B; --line:#1E293B; --line-2:#2A3954;
  --fg:#E2E8F0; --fg-2:#B4C0D2; --mute:#7C8BA1; --dim:#4A5870;
  --cyan:#00F2FE; --emerald:#10B981; --purple:#6366F1; --nv:#76B900; --red:#FF3B30; --amber:#FF9500;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}

#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:10px 14px;padding:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(17,22,34,.92),rgba(8,10,14,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:28px;height:28px;flex:none}
.brand h1{font:700 12.5px/1 var(--sans);letter-spacing:.16em;margin:0;white-space:nowrap}
.brand small{display:block;font:500 9.5px/1.2 var(--mono);letter-spacing:.16em;color:var(--mute);margin-top:4px;white-space:nowrap}
.tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb-sep{width:1px;height:22px;background:var(--line)}
.fps{font:500 10px var(--mono);color:var(--dim);letter-spacing:.1em;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line);background:rgba(17,22,34,.85);color:var(--fg-2);font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:border-color .15s,color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border-color:rgba(0,242,254,.45);color:var(--cyan);background:rgba(0,242,254,.07)}
.btn.primary:hover{box-shadow:0 0 14px rgba(0,242,254,.25)}
.btn.danger{border-color:rgba(255,59,48,.45);color:#FF6A61;background:rgba(255,59,48,.08)}
.btn.on{border-color:rgba(0,242,254,.6);color:var(--cyan);background:rgba(0,242,254,.12)}
.btn.drain.on{border-color:rgba(255,59,48,.7);color:#FF5A50;background:rgba(255,59,48,.14);box-shadow:0 0 16px rgba(255,59,48,.3)}
.btn.rec.on{border-color:rgba(255,59,48,.7);color:#fff;background:rgba(255,59,48,.75)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.sm{height:26px;padding:0 9px;font-size:9.5px}
.btn.block{width:100%;justify-content:center}
.btn svg{width:14px;height:14px;flex:none}
.sel,.inp{height:30px;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:0 8px;font:500 11.5px var(--mono);min-width:0;width:100%}
.sel:hover,.inp:hover{border-color:var(--line-2)}
.sel:focus,.inp:focus{border-color:rgba(0,242,254,.6);outline:none}
.tb-preset{width:230px}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:minmax(0,1fr) 376px;min-height:0}
#viewport-col{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px;gap:10px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#view{display:block;border:1px solid var(--line);border-radius:6px;background:#05070A;touch-action:none;cursor:default;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.stage-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--cyan);background:rgba(8,10,14,.86);border:1px solid rgba(0,242,254,.45);padding:7px 12px;border-radius:6px;pointer-events:none;white-space:nowrap}
.stage-banner.rec{color:#fff;border-color:rgba(255,59,48,.8);background:rgba(120,12,8,.85)}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(0,242,254,.6);border-radius:8px;background:rgba(0,242,254,.06);font:600 12px var(--mono);letter-spacing:.14em;color:var(--cyan);pointer-events:none}

/* ---------- timeline ---------- */
#timeline{background:rgba(17,22,34,.74);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timecode{font:600 15px var(--mono);color:var(--fg);letter-spacing:.04em;font-variant-numeric:tabular-nums;min-width:150px}
.timecode span{color:var(--dim);font-weight:500}
.framecode{font:500 10px var(--mono);color:var(--mute);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.stress-chip{display:inline-flex;align-items:center;gap:7px;font:600 10px var(--mono);letter-spacing:.1em;color:var(--mute)}
.stress-chip i{display:block;width:70px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.stress-chip i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--amber),var(--red))}
.spacer{flex:1}
#tl{width:100%;height:96px;display:block;touch-action:none;cursor:ew-resize}

/* ---------- dock ---------- */
#dock{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:rgba(11,14,21,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);flex:none}
.tab{padding:12px 0 10px;font:600 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;text-transform:uppercase}
.tab:hover{color:var(--fg-2)}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan);background:linear-gradient(180deg,transparent,rgba(0,242,254,.06))}
#inspector{flex:1;overflow-y:auto;padding:14px 14px 56px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
details.sec{background:rgba(17,22,34,.74);border:1px solid var(--line);border-radius:8px}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:8px;font:600 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--fg-2);text-transform:uppercase;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'';margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.sec-body{padding:2px 12px 13px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 64px;align-items:center;gap:8px;min-height:26px}
.row.wide{grid-template-columns:92px minmax(0,1fr)}
.row>label,.lbl{font:500 9.5px/1.25 var(--mono);color:var(--mute);letter-spacing:.07em;text-transform:uppercase}
.ctl-num{height:24px;width:100%;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--fg);font:500 11px var(--mono);text-align:right;padding:0 5px;font-variant-numeric:tabular-nums}
.ctl-num:hover{border-color:var(--line)}
.ctl-num:focus{border-color:rgba(0,242,254,.6);outline:none;background:var(--card)}
.inp.sm{height:26px;font-size:11px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan) var(--p,50%),#1E293B var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#E6FDFF;border:2px solid var(--cyan);margin-top:-4.5px;box-shadow:0 0 8px rgba(0,242,254,.55)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#1E293B}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--cyan)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#E6FDFF;border:2px solid var(--cyan);box-shadow:0 0 8px rgba(0,242,254,.55)}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--card);padding:2px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;height:26px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--mute);font:600 9px var(--mono);letter-spacing:.06em;cursor:pointer;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button.on{background:rgba(0,242,254,.11);color:var(--cyan)}
.switch{position:relative;width:34px;height:18px;border-radius:9px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;flex:none;padding:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.switch[aria-checked=true]{border-color:rgba(0,242,254,.6);background:rgba(0,242,254,.14)}
.switch[aria-checked=true]::after{transform:translateX(16px);background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:5px;background:var(--c);border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sw.on{border-color:#fff;box-shadow:0 0 10px var(--c)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto;justify-content:center}

.list{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:6px;cursor:pointer;font:500 11px var(--mono);color:var(--fg-2);min-width:0}
.li:hover{background:rgba(30,41,59,.45)}
.li.on{border-color:rgba(0,242,254,.4);background:rgba(0,242,254,.06);color:var(--fg)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{color:var(--dim);font-size:10px;flex:none}
.li .mini{width:22px;height:22px;display:grid;place-items:center;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:4px;flex:none;padding:0}
.li .mini:hover{color:var(--fg);background:rgba(30,41,59,.7)}
.li .mini svg{width:13px;height:13px}
.li.off .nm{color:var(--dim);text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.hint{font:400 11.5px/1.55 var(--sans);color:var(--mute);margin:0}
.hint b{color:var(--fg-2);font-weight:600}
.kbd{font:600 9.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg-2);white-space:nowrap}
.insp-head{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,rgba(17,22,34,.95),rgba(22,28,43,.75))}
.insp-head .t{flex:1;min-width:0}
.insp-head .t b{display:block;font:700 13px var(--sans);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-head .t small{display:block;font:500 9.5px var(--mono);color:var(--mute);letter-spacing:.12em;margin-top:3px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber),var(--red));width:0}
.drain-big{height:44px;font-size:11.5px;letter-spacing:.16em}
.dropzone{border:1px dashed var(--line-2);border-radius:8px;padding:16px 12px;text-align:center;cursor:pointer;background:rgba(8,10,14,.5);transition:border-color .15s,background .15s;width:100%;color:var(--fg-2)}
.dropzone:hover{border-color:rgba(0,242,254,.6);background:rgba(0,242,254,.04)}
.dropzone b{display:block;font:600 11px var(--mono);letter-spacing:.12em;color:var(--cyan);margin-bottom:5px}
.dropzone span{font-size:11.5px;color:var(--mute)}
.thumb{width:34px;height:22px;border-radius:3px;object-fit:cover;background:#000;border:1px solid var(--line);flex:none}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(3,5,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.modal-card h2{margin:0;font:700 12px var(--mono);letter-spacing:.16em;color:var(--cyan)}
.modal-card textarea{width:100%;min-height:320px;background:#070A10;border:1px solid var(--line);border-radius:6px;color:#CFE8F2;font:500 11px/1.5 var(--mono);padding:10px;resize:vertical}
.modal-card img,.modal-card video{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(17,22,34,.96);border:1px solid var(--line-2);color:var(--fg);font:500 11.5px var(--mono);padding:9px 14px;border-radius:7px;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100% - 32px)}

@media (max-width:1023px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{grid-template-columns:minmax(0,1fr)}
  #viewport-col{padding:12px 16px}
  #stage{flex:none}
  #dock{border-left:0;border-top:1px solid var(--line)}
  #inspector{overflow:visible;padding:14px 16px 56px}
  .brand{width:100%;margin-right:0}
  .tb-preset{width:100%;max-width:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" rx="6" fill="#111622" stroke="#1E293B"/>
        <path d="M6 18 C10 18 10 10 14 10 S18 18 22 18" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
        <circle cx="6" cy="18" r="2" fill="#10B981"/><circle cx="22" cy="18" r="2" fill="#76B900"/><circle cx="14" cy="10" r="2" fill="#6366F1"/>
      </svg>
      <div><h1>LIQUIDITY FLOW STUDIO</h1><small>MOTION GRAPHICS ENGINE · CAPITAL TOPOLOGY</small></div>
    </div>
    <div class="tb-group">
      <label class="lbl" for="preset">Preset</label>
      <select id="preset" class="sel tb-preset"></select>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H10"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="btn" id="btn-upload" title="Add PNG / image / video layers"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5"/><path d="M2 10v3.5h12V10"/></svg>Media</button>
      <button class="btn" id="btn-import">Import</button>
      <button class="btn primary" id="btn-export">Export JSON</button>
      <button class="btn" id="btn-png">PNG</button>
      <button class="btn rec" id="btn-rec"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5" fill="#FF3B30"/></svg><span>Record</span></button>
      <button class="btn icon" id="btn-help" title="Shortcuts" aria-label="Keyboard shortcuts">?</button>
      <span class="fps" id="fps">-- FPS</span>
    </div>
  </header>

  <main id="main">
    <section id="viewport-col" aria-label="Viewport">
      <div id="stage">
        <canvas id="view" aria-label="Motion graphics viewport"></canvas>
        <div class="stage-banner" id="banner" hidden></div>
        <div id="drop" hidden>DROP PNG / VIDEO TO ADD LAYER</div>
      </div>
      <div id="timeline">
        <div class="transport">
          <button class="btn icon" id="t-start" title="Go to start (Home)" aria-label="Go to start"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="1.8" height="10"/><path d="M13 3v10L5.5 8z"/></svg></button>
          <button class="btn icon primary" id="t-play" title="Play / Pause (Space)" aria-label="Play or pause"></button>
          <button class="btn icon" id="t-loop" title="Loop" aria-label="Loop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9V7a3 3 0 0 1 3-3h7l-2-2M13 7v2a3 3 0 0 1-3 3H3l2 2"/></svg></button>
          <div class="seg" id="t-speed" style="width:132px"><button data-v="0.5">0.5x</button><button data-v="1">1x</button><button data-v="2">2x</button></div>
          <div class="timecode" id="t-code">00:00.00 <span>/ 00:30.00</span></div>
          <div class="framecode" id="t-frame">F 0000</div>
          <div class="spacer"></div>
          <div class="stress-chip">STRESS <i><b id="t-stress"></b></i></div>
          <button class="btn drain" id="t-drain" title="Toggle drain mode (D)">Drain mode</button>
          <button class="btn sm" id="t-camkey" title="Key camera at playhead (K)">◆ Cam key</button>
          <button class="btn sm" id="t-stresskey" title="Key current stress at playhead">◆ Stress key</button>
          <button class="btn sm" id="t-delkey" title="Delete selected keyframe" disabled>Del key</button>
        </div>
        <canvas id="tl" aria-label="Timeline scrubber"></canvas>
      </div>
    </section>

    <aside id="dock" aria-label="Inspector">
      <nav class="tabs" role="tablist">
        <button class="tab" data-tab="node" role="tab">Node</button>
        <button class="tab" data-tab="flow" role="tab">Flow</button>
        <button class="tab" data-tab="camera" role="tab">Camera</button>
        <button class="tab" data-tab="media" role="tab">Media</button>
        <button class="tab" data-tab="scene" role="tab">Scene</button>
      </nav>
      <div id="inspector"></div>
    </aside>
  </main>
</div>

<div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="toast" hidden></div>
<input type="file" id="file-media" accept="image/*,video/*,.png,.jpg,.jpeg,.webp,.gif,.svg,.mp4,.webm,.mov,.m4v" multiple hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* =====================================================================
   CONSTANTS & UTILITIES
   ===================================================================== */
let REF_W = 1920; const REF_H = 1080;            // logical drawing space (height fixed, width follows aspect)
const DEG = Math.PI / 180, TAU = Math.PI * 2;
const TAGS = {
  cyan:    { hex: '#00F2FE', name: 'Liquidity Inflow' },
  emerald: { hex: '#10B981', name: 'Capital' },

  slider(s, 'Saturation', m, 'saturate', 0, 3, .01, { def: 1 }); slider(s, 'Hue shift', m, 'hue', -180, 180, 1, { def: 0, fmt: v => Math.round(v) + '°' });

    btnRow(s, B('Attach to node', () => { const n = NodeSystem.byId(tgt.id); if (n) { n.imageId = a.id; commit(); toast(`Icon attached to ${n.title}`); } }));

}

/* =====================================================================
   TIMELINE VIEW (scrubber + key lanes)
   ===================================================================== */
const TimelineView = {
  cv: $('#tl'), padL: 74, padR: 14, drag: null, hoverX: null,
  get ctx() { return this.cv.getContext('2d'); },
  g: { W: 0, H: 0, tw: 10 },
  geom() { const W = this.cv.clientWidth; this.g = { W, H: this.cv.clientHeight, tw: Math.max(10, W - this.padL - this.padR) }; return this.g; },
  tToX(t) { return this.padL + t / tl.duration * this.g.tw; },
  xToT(x) { return clamp((x - this.padL) / this.g.tw * tl.duration, 0, tl.duration); },
  lanes: { ruler: [0, 22], camera: [28, 50], stress: [56, 92] },
  draw() {
    const cv = this.cv, dpr = Math.min(2, devicePixelRatio || 1), { W, H } = this.geom();
    if (!W) return;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = this.ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    const dur = tl.duration, L = this.lanes, x0 = this.padL, x1 = W - this.padR;
    c.font = '500 9px "JetBrains Mono", monospace'; c.textBaseline = 'middle';
    // ruler
    const step = dur > 90 ? 10 : dur > 40 ? 5 : 1;
    for (let t = 0; t <= dur + 1e-6; t += step) {
      const x = this.tToX(t), major = Math.round(t) % (step === 1 ? 5 : step * 2) === 0;
      c.fillStyle = major ? '#4A5870' : '#2A3954'; c.fillRect(Math.round(x), major ? 4 : 12, 1, major ? 16 : 8);
      if (major) { c.fillStyle = '#7C8BA1'; c.fillText(`${pad2(Math.floor(t / 60))}:${pad2(Math.round(t % 60))}`, x + 4, 8); }
    }
    // lanes
    const lane = (y0, y1, label, on) => {
      c.fillStyle = 'rgba(8,10,14,.75)'; c.fillRect(x0, y0, x1 - x0, y1 - y0); c.strokeStyle = '#1E293B'; c.strokeRect(x0 + .5, y0 + .5, x1 - x0 - 1, y1 - y0 - 1);
      c.fillStyle = on ? '#B4C0D2' : '#4A5870'; c.fillText(label, 8, (y0 + y1) / 2);
      c.fillStyle = on ? '#00F2FE' : '#2A3954'; c.fillRect(0, y0 + 4, 2, y1 - y0 - 8);
    };
    lane(L.camera[0], L.camera[1], 'CAMERA', scene.keys.cameraOn);
    lane(L.stress[0], L.stress[1], 'STRESS', scene.keys.stressOn);
    // camera keys
    const cy = (L.camera[0] + L.camera[1]) / 2;
    if (scene.keys.camera.length > 1) { c.strokeStyle = 'rgba(0,242,254,.25)'; c.beginPath(); c.moveTo(this.tToX(scene.keys.camera[0].t), cy); c.lineTo(this.tToX(scene.keys.camera[scene.keys.camera.length - 1].t), cy); c.stroke(); }
    for (const k of scene.keys.camera) {
      const x = this.tToX(k.t), s = selKey?.k === k; c.save(); c.translate(x, cy); c.rotate(Math.PI / 4);
      c.fillStyle = s ? '#FFFFFF' : '#00F2FE'; c.shadowColor = '#00F2FE'; c.shadowBlur = s ? 10 : 4; c.fillRect(-4.5, -4.5, 9, 9); c.restore();
    }
    // stress curve
    const sy0 = L.stress[0] + 4, sy1 = L.stress[1] - 4, vy = v => sy1 - v * (sy1 - sy0);
    if (scene.keys.stress.length) {
      c.beginPath(); c.moveTo(x0, vy(evalStressKeys(0)));
      for (let x = x0; x <= x1; x += 2) c.lineTo(x, vy(evalStressKeys(this.xToT(x))));
      const gr = c.createLinearGradient(0, sy0, 0, sy1); gr.addColorStop(0, 'rgba(255,59,48,.35)'); gr.addColorStop(1, 'rgba(255,149,0,.02)');
      c.strokeStyle = scene.keys.stressOn ? '#FF9500' : '#4A5870'; c.lineWidth = 1.5; c.stroke();
      c.lineTo(x1, sy1); c.lineTo(x0, sy1); c.closePath(); c.fillStyle = gr; c.fill(); c.lineWidth = 1;
      for (const k of scene.keys.stress) { const s = selKey?.k === k; c.fillStyle = s ? '#fff' : '#FF3B30'; c.beginPath(); c.arc(this.tToX(k.t), vy(k.v), s ? 5 : 4, 0, TAU); c.fill(); }
    } else { c.fillStyle = '#4A5870'; c.fillText('DOUBLE-CLICK TO ADD STRESS KEYS', x0 + 10, (sy0 + sy1) / 2); }
    // live stress dot
    c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(this.tToX(tl.t), vy(stress), 2.5, 0, TAU); c.fill();
    // hover + playhead
    if (this.hoverX != null && !this.drag) { c.fillStyle = 'rgba(226,232,240,.15)'; c.fillRect(Math.round(this.hoverX), 0, 1, H); }
    const px = Math.round(this.tToX(tl.t)) + .5;
    c.strokeStyle = '#00F2FE'; c.shadowColor = '#00F2FE'; c.shadowBlur = 8; c.beginPath(); c.moveTo(px, 0); c.lineTo(px, H); c.stroke(); c.shadowBlur = 0;
    c.fillStyle = '#00F2FE'; c.beginPath(); c.moveTo(px - 6, 0); c.lineTo(px + 6, 0); c.lineTo(px, 8); c.closePath(); c.fill();
  },
  pick(x, y) {
    const L = this.lanes;
    if (y >= L.camera[0] && y <= L.camera[1]) for (const k of scene.keys.camera) if (Math.abs(this.tToX(k.t) - x) < 8) return { track: 'camera', k };
    if (y >= L.stress[0] - 4 && y <= L.stress[1] + 4) {
      const sy0 = L.stress[0] + 4, sy1 = L.stress[1] - 4;
      for (const k of scene.keys.stress) if (Math.hypot(this.tToX(k.t) - x, sy1 - k.v * (sy1 - sy0) - y) < 9) return { track: 'stress', k };
    }
    return null;
  },
  init() {
    const cv = this.cv, pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', e => {
      if (recording) return; cv.setPointerCapture(e.pointerId); const p = pos(e), k = this.pick(p.x, p.y);
      if (k) { selKey = k; this.drag = { mode: 'key', moved: false }; $('#t-delkey').disabled = false; if (Inspector.tab === 'camera') Inspector.build(); return; }
      selKey = null; this.drag = { mode: 'scrub', was: tl.playing }; tl.playing = false; tl.seek(this.xToT(p.x));
    });
    cv.addEventListener('pointermove', e => {
      const p = pos(e); this.hoverX = p.x >= this.padL ? p.x : null; if (!this.drag) { cv.style.cursor = this.pick(p.x, p.y) ? 'grab' : 'ew-resize'; return; }
      if (this.drag.mode === 'scrub') tl.seek(this.xToT(p.x));
      else if (selKey) {
        this.drag.moved = true; selKey.k.t = +this.xToT(p.x).toFixed(3);
        if (selKey.track === 'stress') { const L = this.lanes, sy0 = L.stress[0] + 4, sy1 = L.stress[1] - 4; selKey.k.v = +clamp((sy1 - p.y) / (sy1 - sy0), 0, 1).toFixed(3); }
        scene.keys[selKey.track].sort(byT); tl.changed = true;
      }
    });
    const end = () => { if (!this.drag) return; if (this.drag.mode === 'scrub') tl.playing = this.drag.was; else if (this.drag.moved) commit(); this.drag = null; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', () => { this.hoverX = null; });
    cv.addEventListener('dblclick', e => {
      const p = pos(e), L = this.lanes, t = this.xToT(p.x);
      if (p.y >= L.camera[0] && p.y <= L.camera[1]) { addCamKey(t); if (Inspector.tab === 'camera') Inspector.build(); }
      else if (p.y >= L.stress[0]) { const sy0 = L.stress[0] + 4, sy1 = L.stress[1] - 4; addStressKey(t, clamp((sy1 - p.y) / (sy1 - sy0), 0, 1)); }
    });
  },
};

/* =====================================================================
   TRANSPORT & HEADER WIRING
   ===================================================================== */
const Transport = {
  last: {},
  update() {
    const s = { playing: tl.playing, loop: scene.timeline.loop, speed: scene.timeline.speed, drain: scene.flow.drain, key: !!selKey };
    if (s.playing !== this.last.playing) { $('#t-play').innerHTML = s.playing ? ICON.pause : ICON.play; $('#t-play').setAttribute('aria-label', s.playing ? 'Pause' : 'Play'); }
    if (s.loop !== this.last.loop) $('#t-loop').classList.toggle('on', s.loop);
    if (s.speed !== this.last.speed) document.querySelectorAll('#t-speed button').forEach(b => b.classList.toggle('on', +b.dataset.v === s.speed));
    if (s.drain !== this.last.drain) { $('#t-drain').classList.toggle('on', s.drain); $('#t-drain').textContent = s.drain ? '▲ Draining' : 'Drain mode'; }
    if (s.key !== this.last.key) $('#t-delkey').disabled = !s.key;
    this.last = s;
    $('#t-code').innerHTML = `${fmtTime(tl.t)} <span>/ ${fmtTime(tl.duration)}</span>`;
    $('#t-frame').textContent = `F ${String(Math.floor(tl.t * scene.output.fps)).padStart(4, '0')} · ${scene.output.fps} FPS`;
    $('#t-stress').style.width = (stress * 100).toFixed(1) + '%';
  },
};

$('#t-start').onclick = () => tl.seek(0);

  ['Drag card', 'Move node across the grid floor (Ctrl to snap)'], ['Alt + drag card', 'Draw a pipe to another card'], ['C', 'Connect selected node to the next one you click'],
  ['Double-click floor', 'Add node at that point'], ['N', 'Add node'], ['Ctrl + D', 'Duplicate node'], ['Delete', 'Delete selection or selected key'], ['Arrows', 'Nudge selection (Shift = ×5)'],
  ['Drag empty space', 'Pan camera'], ['Shift / right-drag', 'Orbit camera (yaw + pitch)'], ['Wheel / pinch', 'Zoom toward cursor'], ['F', 'Frame all nodes'],
  ['K', 'Set camera key at playhead'], ['D', 'Toggle drain mode'], ['Ctrl + Z / Shift+Z', 'Undo / redo'], ['Ctrl + S', 'Export scene JSON'], ['Esc', 'Cancel connect / recording, clear selection'],
].flatMap(([k, v]) => [el('span', { class: 'kbd' }, k), el('span', { class: 'hint' }, v)])), el('div', { class: 'btn-row' }, el('button', { class: 'btn', onclick: closeModal }, 'Close'))]);

/* =====================================================================
   BOOT
   ===================================================================== */
TimelineView.init();

Inspector.setTab('node');
